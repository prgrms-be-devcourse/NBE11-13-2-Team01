spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/delivery_service_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

weather:
  api:
    key: test-key
